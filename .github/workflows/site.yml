name: Site

on:
  push:
    branches:
      - main
  # Rebuilt every night: project versions and files kept up to date
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    name: Construire et vérifier (parcours + RGAA)
    # Ubuntu 24.04 pinned: Playwright 1.56 does not support Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Only the public repositories of site.config.json are collected (refused otherwise).
      - name: Collecter les projets depuis GitHub
        run: npm run collect
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: npm run build

      # Accessibility (RGAA) and journey in a real browser: if a criterion breaks,
      # the site is not published.
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Vérifier le site dans le navigateur (parcours + RGAA)
        run: |
          npx vite preview --port 4173 &
          npx wait-on@8.0.1 -t 30000 http://localhost:4173/
          npm run test:browser

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  publier:
    name: Publier sur GitHub Pages
    needs: construire
    # The template repository itself publishes nothing: only its copies have projects to show.
    if: github.repository != 'Carolinedanslesnuages/niki'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier
        id: deploiement
        uses: actions/deploy-pages@v4
